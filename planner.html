<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Academic Planner</title>
    <style>
        .planner { max-width: 350px; margin: 20px auto; padding: 20px; border: 1px solid #ddd; border-radius: 12px; font-family: sans-serif; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .done { text-decoration: line-through; color: #888; }
        ul { padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
        span { cursor: pointer; flex-grow: 1; }
        button { cursor: pointer; margin-left: 10px; }
    </style>
</head>
<body>

<div class="planner">
    <h2>Academic Planner</h2>
    <input type="text" id="taskInput" placeholder="Add a new task...">
    <input type="text" id="search" placeholder="Search tasks...">
    <button onclick="addTask()">Add</button>
    <button onclick="clearTasks()">Clear All</button>
    <p id="taskCount">0 tasks</p>
    <ul id="taskList"></ul>
</div>

<script>
    // Load tasks from localStorage on startup
    document.addEventListener('DOMContentLoaded', loadTasks);

    function addTask() {
        const input = document.getElementById("taskInput");
        if (input.value.trim() === "") return;
        
        const task = { text: input.value, done: false };
        createTaskElement(task);
        saveTasks();
        input.value = "";
    }

    function createTaskElement(task) {
        const list = document.getElementById("taskList");
        const li = document.createElement("li");
        
        const span = document.createElement("span");
        span.textContent = task.text;
        if (task.done) span.classList.add("done");
        span.onclick = function() { 
            this.classList.toggle("done"); 
            saveTasks(); 
        };
        
        const btn = document.createElement("button");
        btn.textContent = "x";
        btn.onclick = function() { li.remove(); saveTasks(); };

        li.appendChild(span);
        li.appendChild(btn);
        list.appendChild(li);
    }

    function saveTasks() {
        const tasks = [];
        document.querySelectorAll("#taskList li").forEach(li => {
            tasks.push({
                text: li.querySelector("span").textContent,
                done: li.querySelector("span").classList.contains("done")
            });
        });
        localStorage.setItem("academicTasks", JSON.stringify(tasks));
    }

    function loadTasks() {
        const tasks = JSON.parse(localStorage.getItem("academicTasks") || "[]");
        tasks.forEach(createTaskElement);
    }
    document.getElementById("taskInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") {
        addTask();
    }
});
    function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    const exists = [...document.querySelectorAll("#taskList span")]
        .some(span => span.textContent.toLowerCase() === text.toLowerCase());

    if (exists) {
        alert("Task already exists!");
        return;
    }

    createTaskElement({ text, done: false });
    saveTasks();
    input.value = "";
    }
    function clearTasks() {
    if (confirm("Delete all tasks?")) {
        document.getElementById("taskList").innerHTML = "";
        localStorage.removeItem("academicTasks");
    }
    }
    function updateCount() {
    const total = document.querySelectorAll("#taskList li").length;
    document.getElementById("taskCount").textContent =
        `${total} task${total !== 1 ? "s" : ""}`;
    }
    document.getElementById("search").addEventListener("input", function() {
    const value = this.value.toLowerCase();

    document.querySelectorAll("#taskList li").forEach(li => {
        const text = li.querySelector("span").textContent.toLowerCase();
        li.style.display = text.includes(value) ? "" : "none";
    });
});
    const task = {
    text: input.value,
    done: false,
    dueDate: "2026-08-05",
    priority: "High"
};
</script>

</body>
</html>
